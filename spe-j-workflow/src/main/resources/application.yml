spring:
  application:
    name: spe-j-workflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/srm_credit}
    username: ${WORKFLOW_DB_USER:srm_workflow}
    password: ${WORKFLOW_DB_PASSWORD:}
    hikari:
      pool-name: spe-j-workflow
      maximum-pool-size: ${WORKFLOW_DB_POOL_MAX_SIZE:10}
      minimum-idle: ${WORKFLOW_DB_POOL_MIN_IDLE:10}
      connection-timeout: ${WORKFLOW_DB_CONNECTION_TIMEOUT_MS:30000}
      connection-init-sql: SET TIME ZONE 'UTC'
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:srm-credit-settlement}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      max-poll-records: 1
    listener:
      ack-mode: manual_immediate
      auto-startup: ${WORKFLOW_CONSUMER_AUTO_STARTUP:true}

server:
  port: ${SERVER_PORT:18081}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:18082}
  endpoints:
    web:
      exposure:
        include: health,metrics
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles:
        "workflow.settlement.duration": 0.5,0.95,0.99
        "hikaricp.connections.acquire": 0.5,0.95,0.99
  endpoint:
    health:
      show-components: never
      show-details: never
      probes:
        enabled: true

springdoc:
  packages-to-scan: com.backend
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: alpha
    tags-sorter: alpha
    persist-authorization: false

workflow:
  consumer:
    enabled: ${WORKFLOW_CONSUMER_ENABLED:true}
    concurrency: ${WORKFLOW_CONSUMER_CONCURRENCY:3}
  schema:
    expected-version: "6"
    check-enabled: true

logging:
  structured:
    format:
      console: logstash

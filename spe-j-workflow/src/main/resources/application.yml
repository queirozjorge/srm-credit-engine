spring:
  application:
    name: spe-j-workflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/srm_credit}
    username: ${WORKFLOW_DB_USER:srm_workflow}
    password: ${WORKFLOW_DB_PASSWORD:}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:srm-credit-settlement}
      enable-auto-commit: false
    listener:
      ack-mode: manual_immediate
      auto-startup: false

server:
  port: ${SERVER_PORT:18081}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:18082}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: never
      show-details: never
      probes:
        enabled: true

springdoc:
  packages-to-scan: com.backend
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: alpha
    tags-sorter: alpha
    persist-authorization: false

workflow:
  schema:
    expected-version: "3"
    check-enabled: true

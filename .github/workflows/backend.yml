name: Backend
'on':
  pull_request:
    paths: ['spe-j-engine/**', 'spe-j-workflow/**', 'infra/postgres/**', 'infra/kafka/**', 'compose.yaml', '.github/workflows/backend.yml', 'AGENTS.md', 'SPEC.md', 'DATABASE.md']
  push:
    paths: ['spe-j-engine/**', 'spe-j-workflow/**', 'infra/postgres/**', 'infra/kafka/**', 'compose.yaml', '.github/workflows/backend.yml', 'AGENTS.md', 'SPEC.md', 'DATABASE.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        application: [spe-j-engine, spe-j-workflow]
    defaults:
      run:
        working-directory: ${{ matrix.application }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit and PostgreSQL integration tests
        run: ./mvnw -B --no-transfer-progress verify
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: backend-${{ matrix.application }}
          path: |
            ${{ matrix.application }}/target/surefire-reports/
            ${{ matrix.application }}/target/failsafe-reports/
          retention-days: 7
          if-no-files-found: ignore

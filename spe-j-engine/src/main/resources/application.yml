spring:
  application:
    name: spe-j-engine

server:
  port: ${SERVER_PORT:8080}

springdoc:
  packages-to-scan: com.backend
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: alpha
    tags-sorter: alpha
    persist-authorization: false

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;
limit_req_status 429;
limit_req_log_level warn;

resolver 127.0.0.11 valid=10s ipv6=off;

log_format structured escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"duration":$request_time,'
    '"correlation_id":"$request_id"}';

server {
    listen 80;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 308 https://localhost:8443$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name localhost 127.0.0.1 _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/access.log structured;

    error_page 413 = @request_too_large;
    error_page 429 = @rate_limited;
    error_page 502 = @upstream_unavailable;
    error_page 504 = @upstream_timeout;

    location ^~ /api/actuator {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 404 '{"code":"ROTA_INEXISTENTE","message":"A rota solicitada não existe."}';
    }

    location ^~ /actuator {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 404 '{"code":"ROTA_INEXISTENTE","message":"A rota solicitada não existe."}';
    }

    location = /api {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 404 '{"code":"ROTA_INEXISTENTE","message":"A rota solicitada não existe."}';
    }

    location = /auth {
        return 308 /auth/;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /api/ {
        limit_req zone=api_per_ip burst=20 nodelay;
        add_header Cache-Control "no-store" always;

        set $engine_backend spe-j-engine:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$engine_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Idempotency-Key $http_idempotency_key;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /api;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream off;
        proxy_cache off;
        proxy_intercept_errors off;
    }

    location ^~ /auth/ {
        add_header Cache-Control "no-store" always;

        set $keycloak_backend keycloak:8080;
        proxy_pass http://$keycloak_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream off;
        proxy_cache off;
        proxy_intercept_errors off;
    }

    location ~* "^/assets/.*-[a-zA-Z0-9_-]{8,}[.](?:js|css|woff2?|svg|png|jpe?g|webp|ico)$" {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location @request_too_large {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 413 '{"code":"REQUISICAO_MUITO_GRANDE","message":"O conteúdo enviado excede o tamanho máximo permitido."}';
    }

    location @rate_limited {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 429 '{"code":"LIMITE_DE_REQUISICOES_EXCEDIDO","message":"Muitas requisições em pouco tempo. Tente novamente em instantes."}';
    }

    location @upstream_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 502 '{"code":"SERVICO_INDISPONIVEL","message":"Não foi possível conectar ao serviço solicitado."}';
    }

    location @upstream_timeout {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 504 '{"code":"TEMPO_LIMITE_EXCEDIDO","message":"O serviço demorou para responder. Tente novamente."}';
    }
}
